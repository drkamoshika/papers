# Canonical configuration for ChatGPT Scheduled Paper Watch.
# The Scheduled Task itself should contain only a minimal bootstrap instruction:
# read this file from GitHub and execute `task_instructions` below.

version: 2
repository: drkamoshika/papers

sources:
  - arxiv
  - pubmed

# Maximum number of papers included in one execution/report after combining all sources.
max_papers: 20

# Retrieval is count-based rather than date-window-based.
# For each source, discover the newest relevant candidates and inspect up to this many.
# 15 per source gives a pool of up to 30 candidates, from which at most 20 are selected.
retrieval:
  mode: latest_count
  candidates_per_source: 15
  sort: newest_first
  rules:
    - Do not use a fixed lookback-days window.
    - For each configured source, find up to candidates_per_source of the newest papers relevant to the configured topics.
    - For arXiv, do not rely only on category recent/new list pages because cached list pages may be stale. Use search to discover recent candidate IDs, then verify selected candidates on their individual arXiv pages.
    - For PubMed, rank candidates by the most relevant available publication chronology. Prefer electronic publication / online publication date when present; otherwise use the publication date shown by PubMed.
    - Verify candidate metadata on the individual arXiv or PubMed/publisher paper page before including it.

topics:
  - machine learning
  - large language models
  - medical AI
  - healthcare AI

summary:
  language: ja

  # Keep the original concise format because it is easy to scan.
  quick_fields:
    - tags
    - summary
    - why_interesting

  # Then add the more detailed format below it for the same paper.
  detailed_fields:
    - objective
    - methods
    - data_or_experiment
    - key_results
    - novelty
    - limitations
    - why_it_matters

  medical_ai_extra_fields:
    - study_design
    - sample_size
    - primary_endpoint
    - external_validation
    - prospective_or_retrospective

  rules:
    - Prefer primary sources and original paper pages.
    - Read full text when reasonably accessible; otherwise use the abstract.
    - Always state read_level as full_text or abstract.
    - Never imply that full text was read when only the abstract was available.
    - Prefer quantitative results when explicitly available.
    - Do not invent limitations or numerical results that are not supported by the source.
    - For every paper, show the concise quick summary first, then the detailed summary. Do not replace one with the other.

deduplication:
  strategy: notion_seen_id_page
  notion_parent_title: "Paper Watch"
  notion_state_page_title: "Paper Watch — Seen IDs"
  canonical_ids:
    arxiv: arxiv_id
    pubmed: pmid
  rules:
    - At the start of each run, locate exactly one Notion page titled notion_parent_title and its child page titled notion_state_page_title.
    - Read canonical IDs from the Notion state page before selecting papers.
    - Do not use GitHub reports or state files for duplicate detection.
    - Exclude already-seen canonical IDs by default.
    - After the report page is successfully created, append the selected canonical IDs to the Notion state page without duplicating existing IDs.

output:
  mode: notion_and_gmail
  github_write: false
  notion_parent_title: "Paper Watch"
  notion_report_title_prefix: "[paper-report]"
  one_notion_page_per_execution: true
  gmail_recipient: self_connected_account
  gmail_subject_prefix: "[paper-watch]"
  gmail_digest_top_papers: 5
  gmail_include_notion_link: true
  include_overview: true
  include_paper_ids_block: true
  paper_ids_block_format: |
    <!-- PAPER_IDS -->
    arxiv:xxxx.xxxxx
    pmid:xxxxxxxx
    <!-- /PAPER_IDS -->

selection:
  rules:
    - Collect candidates from every configured source according to the retrieval settings.
    - Prefer recent, technically substantive, and potentially influential work.
    - Keep a reasonable balance across machine learning, LLM, and medical AI when candidates permit.
    - Aim for roughly max_papers papers on normal runs when enough worthwhile unseen candidates exist.
    - Do not fill to max_papers with weak or irrelevant papers just to reach the limit.
    - candidates_per_source controls candidate inspection, while max_papers controls the final combined report size.

# This is the actual instruction set for the ChatGPT Scheduled Task.
# Edit this block to change agent behavior. The Scheduled Task should re-read
# this YAML every run, so behavior changes take effect without editing the task itself.
task_instructions: |
  Run one paper-watch cycle using GitHub read access, web search, Notion, and Gmail.

  1. Treat this YAML file as the source of truth for this run. Read and obey all settings in it. GitHub is read-only for this workflow: do not create Issues, commits, files, pull requests, or other GitHub writes.
  2. Locate exactly one Notion page whose title equals deduplication.notion_parent_title and, under it, exactly one child page whose title equals deduplication.notion_state_page_title. If either page is missing or ambiguous, stop and report the failure instead of guessing.
  3. Read the canonical IDs already stored in the Notion state page. Use those IDs for duplicate detection; do not read GitHub historical reports or state files.
  4. Do not use a fixed date lookback. For each configured source independently, discover up to retrieval.candidates_per_source of the newest candidates related to the configured topics, ordered newest first.
  5. For arXiv, do not trust only recent/new category listing pages because they may be stale in the search environment. Discover candidate papers through search, then verify each selected candidate using its individual arXiv page.
  6. For PubMed, use the individual PubMed record and prefer electronic/online publication date when present; otherwise use the publication date shown by PubMed. Do not exclude a paper merely because its journal issue month differs from its online publication date.
  7. Prefer original arXiv and PubMed/publisher paper pages. Gather enough primary-source information to summarize each selected paper accurately.
  8. Exclude previously seen canonical IDs by default.
  9. From the combined candidate pool, select at most max_papers papers according to the configured selection rules. Aim for roughly max_papers on normal runs when enough worthwhile unseen papers exist; return fewer if not.
  10. Write one Japanese report for the entire execution. Start with a short section titled "今回の概況" describing notable trends across the selected papers.
  11. For every paper, include Source, canonical ID, publication date, authors when available, journal/category when available, URL, and read_level.
  12. For every paper, first provide the concise original-style block: Tags, Summary, Why interesting.
  13. Immediately after that concise block, provide the detailed block: 目的, 手法, データ・実験, 主な結果, 新規性, 限界, なぜ注目したか. For medical AI papers, also include the configured medical_ai_extra_fields when the source provides them.
  14. Clearly distinguish full-text reading from abstract-only reading. Never claim to have read information that was not accessible.
  15. At the end of the report, append a PAPER_IDS block containing every selected paper's canonical ID, exactly in the configured format.
  16. Create exactly one Notion child page under output.notion_parent_title. The title must begin with output.notion_report_title_prefix and include the execution date and a short topic label such as "ML / LLM / Medical AI". Put the complete report in that Notion page.
  17. After the Notion report page is successfully created, append every selected canonical ID to the Notion state page, preserving existing IDs and avoiding duplicates. Do not modify any GitHub state file.
  18. Send exactly one Gmail message to the connected Gmail account itself. The subject must begin with output.gmail_subject_prefix and include the execution date. The message should contain the "今回の概況", a concise digest of up to output.gmail_digest_top_papers notable papers, and a link to the newly created Notion report page. Do not duplicate the complete long report in the email.
  19. If YAML reading, candidate verification, Notion lookup/write, state update, or Gmail sending fails, do not invent success or substitute another destination. Report which step failed and any completed steps accurately.
  20. On success, report the Notion page title/URL and that the Gmail notification was sent. Do not create any GitHub Issue or other GitHub write.

notes:
  - This YAML is intentionally designed so most tuning can be done entirely in GitHub.
  - The only settings that remain in ChatGPT Scheduled Tasks are the recurrence/timing and the minimal bootstrap prompt telling ChatGPT to read this file.
