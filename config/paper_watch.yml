# Canonical configuration for the GitHub Actions paper-watch.
# This file is the single operational specification. The runner reads it on every execution.

version: 3
repository: drkamoshika/papers

sources:
  - arxiv
  - pubmed

max_papers: 20

retrieval:
  mode: latest_count
  candidates_per_source: 15
  sort: newest_first
  rules:
    - Do not use a fixed lookback-days window.
    - For each configured source, retrieve up to candidates_per_source of the newest papers relevant to the configured topics.
    - For arXiv, use the arXiv API sorted by submittedDate and retain the canonical arXiv ID.
    - For PubMed, use NCBI E-utilities sorted by publication chronology and prefer electronic/online publication date when present.
    - Use primary-source metadata from arXiv and PubMed/PMC. Do not infer missing metadata.

topics:
  - machine learning
  - large language models
  - medical AI
  - healthcare AI

llm:
  provider: openai
  selection_model: gpt-5.6-luna
  report_model: gpt-5.6-terra
  max_output_tokens: 50000

runner:
  timezone: Asia/Tokyo
  schedule_cron: "0 7 * * *"
  max_full_text_chars_per_paper: 30000
  smtp_host: smtp.gmail.com
  smtp_port: 465

summary:
  language: ja
  quick_fields:
    - tags
    - summary
    - why_interesting
  detailed_fields:
    - objective
    - methods
    - data_or_experiment
    - key_results
    - novelty
    - limitations
    - why_it_matters
  medical_ai_extra_fields:
    - study_design
    - sample_size
    - primary_endpoint
    - external_validation
    - prospective_or_retrospective
  rules:
    - Prefer primary sources and original paper records.
    - Read full text when the automated runner can retrieve and parse it reliably; otherwise use the abstract.
    - Always state read_level as full_text or abstract.
    - Never imply that full text was read when only the abstract was available.
    - Prefer quantitative results when explicitly available.
    - Do not invent limitations, study details, or numerical results that are not supported by the supplied source text.
    - For every paper, show the concise quick summary first, then the detailed summary.

deduplication:
  strategy: seen_id_index
  seen_file: state/seen_papers.txt
  canonical_ids:
    arxiv: arxiv_id
    pubmed: pmid
  rules:
    - Read the configured seen-file before selecting papers.
    - Do not scan Gmail history or historical reports for duplicate detection.
    - Exclude already-seen canonical IDs by default.
    - Update the seen-file only after the Gmail message for the current run is successfully sent.
    - Never add the same canonical ID twice.

output:
  mode: gmail_only
  github_write: seen_file_only
  allowed_github_write_path: state/seen_papers.txt
  gmail_recipient: self
  gmail_subject_prefix: "[paper-watch]"
  gmail_digest_top_papers: 5
  gmail_full_report: true
  include_overview: true
  include_paper_ids_block: true
  paper_ids_block_format: |
    <!-- PAPER_IDS -->
    arxiv:xxxx.xxxxx
    pmid:xxxxxxxx
    <!-- /PAPER_IDS -->

selection:
  rules:
    - Collect candidates from every configured source according to the retrieval settings.
    - Prefer recent, technically substantive, and potentially influential work.
    - Keep a reasonable balance across machine learning, LLM, and medical AI when candidates permit.
    - Aim for roughly max_papers papers on normal runs when enough worthwhile unseen candidates exist.
    - Do not fill to max_papers with weak or irrelevant papers just to reach the limit.
    - candidates_per_source controls candidate inspection, while max_papers controls the final combined report size.

task_instructions: |
  Run one paper-watch cycle from GitHub Actions using this YAML as the source of truth.

  1. Read state/seen_papers.txt and exclude previously reported canonical IDs.
  2. Retrieve the newest configured number of candidates independently from arXiv and PubMed without a fixed lookback window.
  3. Use the configured selection model to choose at most max_papers papers according to selection.rules.
  4. For selected arXiv papers, attempt to retrieve and parse the PDF. For PubMed papers with a PMCID, attempt to retrieve PMC full text. If full text cannot be parsed reliably, use the abstract and set read_level: abstract.
  5. Generate one Japanese report for the entire execution.
  6. Start the email with a section titled "ダイジェスト", containing "今回の概況" and up to output.gmail_digest_top_papers notable papers.
  7. After the digest, include the complete report in full.
  8. For every paper include Source, canonical ID, publication date, authors when available, journal/category when available, URL, and read_level.
  9. For every paper first provide Tags, Summary, Why interesting.
  10. Immediately after that provide 目的, 手法, データ・実験, 主な結果, 新規性, 限界, なぜ注目したか.
  11. For medical AI papers also include study design, sample size, primary endpoint, external validation, and prospective/retrospective when supported by the source.
  12. Clearly distinguish full-text reading from abstract-only reading and never invent unsupported facts.
  13. End the report with a PAPER_IDS block containing every selected canonical ID.
  14. Send exactly one Gmail message containing both the digest and complete report.
  15. Only after Gmail sending succeeds, append the selected canonical IDs to state/seen_papers.txt.
  16. Do not create GitHub Issues or report files. The only persistent GitHub write produced by a normal run is the seen-file update.
  17. If retrieval, model inference, Gmail sending, or state update fails, fail the workflow rather than silently substituting another path.

notes:
  - GitHub Actions is the execution environment; ChatGPT Scheduled Tasks are not used.
  - Required GitHub Actions secrets are OPENAI_API_KEY, GMAIL_ADDRESS, and GMAIL_APP_PASSWORD.
  - The workflow is scheduled for 07:00 Asia/Tokyo and also supports workflow_dispatch for manual testing.
