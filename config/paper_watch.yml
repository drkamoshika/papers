# Canonical configuration for ChatGPT Scheduled Paper Watch.
# ChatGPT reads this file on every run. The scheduled task may write daily reports to GitHub; this config is read during execution.

version: 5
repository: drkamoshika/papers

execution:
  platform: chatgpt_scheduled_task
  schedule: daily_0700_asia_tokyo
  external_writes: github_daily_report_only
  delivery: github_markdown_and_chatgpt_digest

sources:
  - arxiv
  - pubmed

max_papers: 20

retrieval:
  mode: latest_count
  candidates_per_source: 15
  sort: newest_first
  rules:
    - Do not use a fixed lookback-days window.
    - For each configured source, discover up to candidates_per_source of the newest papers relevant to the configured topics.
    - For arXiv, do not rely only on cached recent/new list pages. Discover recent candidate IDs through web search and verify selected candidates on their individual arXiv pages.
    - For PubMed, verify selected candidates on their individual PubMed records and prefer electronic/online publication date when present.
    - Prefer primary sources and original paper pages.

topics:
  - machine learning
  - large language models
  - medical AI
  - healthcare AI

summary:
  language: ja

  quick_fields:
    - tags
    - summary
    - why_interesting

  detailed_fields:
    - objective
    - methods
    - data_or_experiment
    - key_results
    - novelty
    - limitations
    - why_it_matters

  medical_ai_extra_fields:
    - study_design
    - sample_size
    - primary_endpoint
    - external_validation
    - prospective_or_retrospective

  rules:
    - Prefer primary sources and original paper pages.
    - Read full text when reasonably accessible; otherwise use the abstract.
    - Always state read_level as full_text or abstract.
    - Never imply that full text was read when only the abstract was available.
    - Prefer quantitative results when explicitly available.
    - Do not invent limitations or numerical results that are not supported by the source.
    - For every paper, show the concise quick summary first, then the detailed summary.

deduplication:
  strategy: scheduled_task_internal_state
  max_seen_ids: 1500
  canonical_ids:
    arxiv: arxiv_id
    pubmed: pmid
  rules:
    - Read the seen-ID state embedded in the Scheduled Task prompt.
    - Exclude already-seen canonical IDs by default.
    - After a successful run, update only the Scheduled Task's own internal seen-ID state.
    - Do not write deduplication state to GitHub, Gmail, Notion, or any other external app.
    - Keep at most max_seen_ids most recent IDs in task state.

output:
  mode: github_markdown_and_chatgpt_digest
  include_overview: true
  include_digest: true
  digest_top_papers: 5
  include_full_report: true
  github_report_path: reports/daily/YYYY-MM-DD.md
  include_paper_ids_block: true
  schema_version: 1
  canonical_format: docs/PAPER_SCHEMA.md
  paper_ids_block_format: |
    <!-- PAPER_IDS -->
    arxiv:xxxx.xxxxx
    pmid:xxxxxxxx
    <!-- /PAPER_IDS -->

selection:
  rules:
    - Collect candidates from every configured source according to the retrieval settings.
    - Prefer recent, technically substantive, and potentially influential work.
    - Keep a reasonable balance across machine learning, LLM, and medical AI when candidates permit.
    - Aim for roughly max_papers papers on normal runs when enough worthwhile unseen candidates exist.
    - Do not fill to max_papers with weak or irrelevant papers just to reach the limit.
    - candidates_per_source controls candidate inspection, while max_papers controls the final combined report size.

task_instructions: |
  Run one paper-watch cycle inside ChatGPT.

  1. Treat this YAML file as the source of truth for retrieval, selection, and report format.
  2. Do not use Gmail, Notion, local models, or external LLM APIs. GitHub writes are allowed only for the daily Markdown report.
  3. Use the Scheduled Task prompt's embedded seen-ID state for duplicate detection.
  4. Search the web for relevant arXiv and PubMed candidates according to retrieval settings.
  5. Verify every selected paper using its individual arXiv or PubMed/publisher primary page.
  6. Exclude canonical IDs already present in the task's seen-ID state.
  7. Select at most max_papers according to selection.rules.
  8. Generate one complete Japanese Markdown report and save it to GitHub at output.github_report_path with YYYY-MM-DD replaced by the run date in Asia/Tokyo.
  9. Begin with "## ダイジェスト", including "### 今回の概況" and up to output.digest_top_papers notable papers.
  10. Then include "## 完全版レポート" and every selected paper. Each paper MUST start with exactly "### Paper: <title>". Do not add other headings beginning with "### Paper:".
  11. Follow docs/PAPER_SCHEMA.md exactly: one fixed-order bullet per field, including Source, Canonical ID, Publication date, URL, read_level, Tags, Summary, Objective, Methods, Data and results, Novelty, Limitations. Use 未記載 for unknown values, not guessed facts. Never combine fields on one line. Do not put a paper in a table or a differently formatted appendix.
  12. For each paper use ONLY the canonical fields in docs/PAPER_SCHEMA.md, in exactly that order. Put the reason for interest in Novelty, not an extra Why interesting field. Medical details belong in Methods, Data and results, or Limitations; never introduce extra field names.
  13. For medical AI papers include the configured medical_ai_extra_fields when supported by the source.
  14. End with a PAPER_IDS block containing every selected canonical ID exactly once; all IDs in the block MUST match the paper sections exactly.
  15. Only after the report is successfully generated, update this Scheduled Task's own seen-ID state by unioning the new IDs and retaining at most deduplication.max_seen_ids most recent IDs.
  16. After generating the complete report, use GitHub create_file to save it. If the date's report already exists, fetch its SHA and update_file instead. Fetch the saved file and verify its content. Only after successful verification, update internal seen-ID state. If saving fails, report the failure and do not mark new IDs as seen.
  17. Return a short ChatGPT digest with the date, number of papers, 2-3 notable topics, and a GitHub link to the saved report. Do not reproduce the full report in chat unless GitHub saving fails.
  18. Do not change any other repository files. The scheduled task may only write the daily Markdown report. The dashboard workflow owns docs/papers.json.
  19. If web search, primary-source verification, GitHub saving, or internal task-state update fails, report the failure accurately and do not invent success.

notes:
  - ChatGPT Scheduled Tasks can send built-in push/email notifications; delivery does not rely on a Gmail write action.
  - GitHub is used as a configuration source and as the storage for daily Markdown reports.
