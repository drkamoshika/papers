name: Paper Dashboard - schema validation and index
on:
  push:
    branches: [main]
    paths:
      - 'reports/daily/**'
      - 'scripts/build_dashboard_index.py'
      - 'docs/paper.schema.json'
      - 'docs/PAPER_SCHEMA.md'
      - '.github/workflows/paper-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-dashboard-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Validate all reports and build JSON
        run: python scripts/build_dashboard_index.py
      - name: Commit regenerated dashboard index
        run: |
          if git diff --quiet -- docs/papers.json; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/papers.json
          git commit -m "chore: rebuild paper dashboard index"
          git push
