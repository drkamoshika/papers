name: Paper Dashboard - verify publication dates and rebuild index
on:
  push:
    branches: [main]
    paths:
      - 'reports/daily/**'
      - 'scripts/build_dashboard_index.py'
      - 'scripts/refresh_publication_dates.py'
      - 'docs/paper.schema.json'
      - 'docs/publication-dates.json'
      - 'docs/PAPER_SCHEMA.md'
      - 'docs/overview.json'
      - 'docs/LIVING_REVIEW.md'
      - 'reports/overviews/**'
      - 'reports/weekly/**'
      - 'scripts/validate_living_review.py'
      - 'tests/test_paper_schema.py'
      - 'tests/test_publication_dates.py'
      - '.github/workflows/paper-dashboard.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-dashboard-index
  cancel-in-progress: false
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Run parser and date metadata regression tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate the unified living review
        run: python scripts/validate_living_review.py
      - name: Retrieve and verify original publication dates from arXiv and PubMed
        run: python scripts/refresh_publication_dates.py --apply
      - name: Validate all reports and build JSON
        run: python scripts/build_dashboard_index.py
      - name: Commit verified Markdown dates, metadata provenance, and JSON
        run: |
          git add reports/daily/ docs/papers.json docs/publication-dates.json
          if git diff --cached --quiet; then
            echo "Publication metadata and dashboard index unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: verify publication dates against arXiv and PubMed"
          git push
