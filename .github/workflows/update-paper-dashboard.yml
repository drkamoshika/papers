name: Update paper dashboard
on:
  push:
    branches: [main]
    paths:
      - 'reports/daily/**'
      - 'reports/issue-*.md'
      - 'scripts/build_dashboard_index.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build search index
        run: python scripts/build_dashboard_index.py
      - name: Commit updated index if changed
        run: |
          if ! git diff --quiet -- docs/papers.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/papers.json
            git commit -m "Refresh paper dashboard index"
            git push
          fi
