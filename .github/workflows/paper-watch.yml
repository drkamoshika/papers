name: Paper Watch

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: paper-watch
  cancel-in-progress: false

jobs:
  paper-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Cache local language model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen3-4b-v1

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if ollama list >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          ollama pull qwen3:4b
          ollama list

      - name: Check required Gmail secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          missing = [
              name for name in (
                  "GMAIL_ADDRESS",
                  "GMAIL_APP_PASSWORD",
              )
              if not os.environ.get(name, "").strip()
          ]
          if missing:
              raise SystemExit(
                  "Missing GitHub Actions secrets: " + ", ".join(missing)
              )
          print("Required Gmail secrets are configured.")
          PY

      - name: Run paper watch
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python scripts/paper_watch.py

      - name: Commit seen-paper state
        run: |
          if git diff --quiet -- state/seen_papers.txt; then
            echo "No seen-paper state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen_papers.txt
          git commit -m "Update paper watch seen IDs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
