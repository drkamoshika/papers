<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Watch | Research Library</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1d2939;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}
header{background:#12283b;color:white;padding:24px max(20px,calc((100vw - 1160px)/2))}
header h1{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}header p{font-size:13px;margin:0;color:#bacbd8}
.wrap{max-width:1160px;margin:auto;padding:22px 20px}
.catalog-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.catalog-top h2{font-size:18px;margin:0}.total{font-size:13px;color:#64748b}
.collection-switch{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.collection-tab{border:1px solid #cbd5e1;background:white;border-radius:9px;padding:11px 16px;cursor:pointer;color:#40546b;font-weight:600}.collection-tab[aria-pressed="true"]{background:#163e5c;color:white;border-color:#163e5c}.collection-note{font-size:13px;line-height:1.8;color:#52667a;margin:0 0 16px}.collection-note a{color:#1768a3}.source-label.other{background:#f3ecdf;color:#805c22}[hidden]{display:none!important}
.source-switch{display:flex;gap:5px;flex-wrap:wrap;background:#e8edf3;border-radius:11px;padding:5px;margin-bottom:12px}
.source-tab{border:0;background:transparent;border-radius:8px;color:#40546b;cursor:pointer;padding:10px 17px;font-weight:600;font-size:14px}
.source-tab:hover{background:#f7fafc}.source-tab[aria-pressed="true"]{background:#fff;color:#123e63;box-shadow:0 1px 5px #102b3a1c}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:white;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;color:inherit}
input{flex:1;min-width:220px}select{min-width:185px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;color:#64748b}
.button{border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:7px 11px;cursor:pointer}.button:hover{background:#f0f5fa}
.layout{display:grid;grid-template-columns:minmax(260px,0.85fr) minmax(0,1.4fr);gap:14px;align-items:start}
.panel{background:white;border:1px solid #dfe7ee;border-radius:12px;overflow:hidden}
.list{max-height:72vh;overflow-y:auto}
.paper{display:block;width:100%;padding:13px 16px;border:0;border-bottom:1px solid #edf0f5;background:white;color:inherit;text-align:left;cursor:pointer}
.paper:last-child{border-bottom:0}.paper:hover{background:#f6f9fc}.paper.active{background:#edf5fc;box-shadow:inset 3px 0 #2274ae}
.paper-meta{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.source-label{display:inline-block;border-radius:5px;background:#e7f1fb;color:#185681;font-size:11px;font-weight:700;padding:3px 7px}
.source-label.pubmed{background:#e6f4ed;color:#176a4a}
.field-panel{background:#fff;border:1px solid #dfe7ee;border-radius:12px;padding:15px 16px;margin-bottom:16px}
.field-heading{font-size:14px;margin:0 0 10px}.field-filters{display:flex;flex-wrap:wrap;gap:7px}
.field-filter,.field-badge{--field-color:#52667a;--field-bg:#eef2f6;color:var(--field-color);background:var(--field-bg);border:1px solid transparent;border-radius:7px;font-size:12px;line-height:1.5}
.field-filter{display:inline-flex;align-items:center;gap:8px;padding:7px 10px;text-align:left;cursor:pointer}
.field-filter:hover,.field-badge:is(button):hover{border-color:var(--field-color)}
.field-filter[aria-pressed="true"]{border-color:var(--field-color);box-shadow:inset 0 0 0 1px var(--field-color);font-weight:700}
.field-count{font-variant-numeric:tabular-nums;opacity:.8}.field-note{font-size:12px;color:#64748b;margin:10px 0 0;line-height:1.7}
.field-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.field-badge{display:inline-block;padding:3px 7px}.field-badge:is(button){cursor:pointer}
[data-field-key="language"]{--field-color:#24558a;--field-bg:#eaf2fc}
[data-field-key="agents"]{--field-color:#6b4691;--field-bg:#f1ecf8}
[data-field-key="trust"]{--field-color:#925b16;--field-bg:#fcf2df}
[data-field-key="medical"]{--field-color:#176a4a;--field-bg:#e6f4ed}
[data-field-key="structured"]{--field-color:#176879;--field-bg:#e6f3f6}
[data-field-key="events"]{--field-color:#994654;--field-bg:#fbeef0}
[data-field-key="neuroscience"]{--field-color:#665b22;--field-bg:#f5f2df}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #69a8d8;outline-offset:3px}
.paper-date,.meta{color:#64748b;font-size:12px}
.paper-title{display:block;font-size:14px;font-weight:600;line-height:1.6;overflow-wrap:anywhere}
.detail{padding:24px;max-height:72vh;overflow-y:auto}
.detail h2{font-size:21px;line-height:1.5;margin:10px 0 14px;overflow-wrap:anywhere}
.detail h4{margin:22px 0 7px}.detail p{line-height:1.8;white-space:pre-wrap;font-size:14px}
.detail a{color:#1768a3}.tag{display:inline-block;background:#eaf2f8;color:#345a78;border-radius:5px;font-size:11px;padding:3px 6px;margin:3px 4px 0 0}
.empty{padding:32px 20px;text-align:center;color:#64748b}.notice{font-size:12px;color:#64748b;margin-top:18px}
@media(max-width:750px){header{padding:20px}.wrap{padding:16px 12px}.layout{grid-template-columns:1fr}.list{max-height:43vh}.detail{max-height:none}.source-tab{flex:1;padding:10px 9px}.detail{padding:18px}.paper{padding:12px 14px}select{flex:1}}
</style></head><body>
<header><h1>Paper Watch <span style="font-weight:400;opacity:.65">/ Research Library</span></h1><p>機械学習・LLM・医療AIの論文アーカイブ</p></header>
<main class="wrap">
  <div class="catalog-top"><h2>論文一覧</h2><span class="total" id="total">読み込み中...</span></div>
  <nav class="collection-switch" aria-label="文献集">
    <button type="button" class="collection-tab" data-collection="daily" aria-pressed="true">新着論文 <span id="daily-count"></span></button>
    <button type="button" class="collection-tab" data-collection="foundations" aria-pressed="false">基礎文献 <span id="foundations-count"></span></button>
    <button type="button" class="collection-tab" data-collection="" aria-pressed="false">両方</button>
  </nav>
  <p class="collection-note" id="collection-note">定期レポートで紹介した新着論文を掲載しています。</p>
  <section class="field-panel" id="field-panel" aria-labelledby="field-heading" hidden>
    <h3 class="field-heading" id="field-heading">基礎文献の分野</h3>
    <nav class="field-filters" id="field-filters" aria-label="分野で絞り込む"></nav>
    <p class="field-note" id="field-note">分野を読み込み中...</p>
  </section>
  <nav class="source-switch" aria-label="論文の出典">
    <button type="button" class="source-tab" data-source="" aria-pressed="true">すべて <span id="all-count"></span></button>
    <button type="button" class="source-tab" data-source="arXiv" aria-pressed="false">arXiv <span id="arxiv-count"></span></button>
    <button type="button" class="source-tab" data-source="PubMed" aria-pressed="false">PubMed <span id="pubmed-count"></span></button>
    <button type="button" class="source-tab" data-source="other" aria-pressed="false">出版社・その他 <span id="other-count"></span></button>
  </nav>
  <div class="filters">
    <input id="search" type="search" aria-label="論文検索" placeholder="タイトル・論文ID・本文などを検索">
    <select id="sort" aria-label="並び替え">
      <option value="date-new">論文公開日：新しい順</option>
      <option value="date-old">論文公開日：古い順</option>
      <option value="report-new">レポート日：新しい順</option>
      <option value="report-old">レポート日：古い順</option>
      <option value="title">タイトル順</option>
    </select>
  </div>
  <div class="toolbar"><span id="count">読み込み中...</span><button class="button" type="button" id="clear">条件をクリア</button></div>
  <div class="layout">
    <div class="panel list" id="list" aria-label="論文一覧"></div>
    <article class="panel detail" id="detail"><div class="empty">論文を選択すると詳細を表示します。</div></article>
  </div>
  <p class="notice">一覧に分野ラベル・出典・論文公開日・レポート日・タイトルを表示。論文を選ぶと要約と出典を読めます。公開日未確認の論文は公開日順では末尾になります。</p>
</main><script>
const fieldDefinitions = [
  {key:"language",label:"言語モデルの学習・推論・効率化"},
  {key:"agents",label:"エージェント・検索・記憶・協調"},
  {key:"trust",label:"評価・安全性・解釈可能性"},
  {key:"medical",label:"医療・生体信号・創薬AI"},
  {key:"structured",label:"表形式・時系列・因果推論"},
  {key:"events",label:"次イベント予測・点過程"},
  {key:"neuroscience",label:"神経科学とAI"},
  {key:"classics",label:"主要な出発点",display:"古典・共通基礎（別冊）"}
];
const initialParams = new URLSearchParams(window.location.search);
const initialCollection = initialParams.get("collection");
let papers = [], selected = null, sourceFilter = "", collectionLoadWarning = "";
let collectionFilter = initialCollection === "all" ? "" : initialCollection === "foundations" ? "foundations" : "daily";
let fieldFilter = fieldDefinitions.some(f=>f.key===initialParams.get("field")) ? initialParams.get("field") : "";
if(fieldFilter && collectionFilter !== "foundations") collectionFilter = "foundations";
const $ = id => document.getElementById(id);
const tagList = p => Array.isArray(p.tags) ? p.tags : String(p.tags || "").split(",").map(s => s.trim()).filter(Boolean);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const repo = "https://github.com/drkamoshika/papers/blob/main/";
const validDate = value => /^\d{4}-\d{2}-\d{2}$/.test(String(value || "")) ? value : "";
const sourceName = p => p.source || "出典未確認";
const sourceClass = p => p.source === "PubMed" ? "pubmed" : p.source === "arXiv" ? "" : "other";
const readLevel = p => ({abstract:"要旨確認",full_text:"本文の関連箇所確認",bibliographic:"書誌情報のみ"}[p.read_level] || "確認範囲未記載");
const hasCollection = (p,c) => !c || p.collections.includes(c);
const paperFields = p => fieldDefinitions.filter(f=>(p.fields || []).includes(f.label));
const hasField = (p,key) => !key || paperFields(p).some(f=>f.key===key);
const safeUrl = url => /^https:\/\//.test(String(url || "")) ? url : "#";
function fieldBadges(p,interactive=false) {
  return paperFields(p).map(f => interactive ?
    '<button type="button" class="field-badge" data-field-key="'+f.key+'" data-detail-field="'+f.key+'" aria-label="'+esc(f.label)+'で絞り込む" aria-pressed="'+(fieldFilter===f.key)+'">'+esc(f.display || f.label)+'</button>' :
    '<span class="field-badge" data-field-key="'+f.key+'">'+esc(f.display || f.label)+'</span>'
  ).join("");
}
function syncUrl() {
  const url = new URL(window.location.href);
  if(collectionFilter === "daily") url.searchParams.delete("collection");
  else url.searchParams.set("collection",collectionFilter || "all");
  if(fieldFilter) url.searchParams.set("field",fieldFilter);
  else url.searchParams.delete("field");
  if(url.href !== window.location.href) window.history.replaceState(null,"",url);
}
function chooseField(key) {
  fieldFilter = key;
  if(key && collectionFilter !== "foundations") { collectionFilter="foundations"; sourceFilter=""; }
  renderList();
}
$("field-filters").innerHTML = [{key:"",label:"すべての分野"},...fieldDefinitions].map(f=>
  '<button type="button" class="field-filter" data-filter-field="'+f.key+'" data-field-key="'+f.key+'" aria-pressed="false"><span>'+esc(f.display || f.label)+'</span><span class="field-count"></span></button>'
).join("");
for(const e of $("field-filters").querySelectorAll("[data-filter-field]")) e.onclick=()=>chooseField(e.dataset.filterField);
function detail(p) {
  if (!p) return;
  selected = p.id;
  const fields = [["研究目的",p.objective],["手法・研究デザイン",p.methods],["実験・主な結果",p.results],["新規性",p.novelty],["限界",p.limitations]];
  const sections = fields.map(([label,val]) => "<h4>"+esc(label)+"</h4><p>"+esc(val || "未記載")+"</p>").join("");
  $("detail").innerHTML =
    '<div class="meta">'+esc(sourceName(p))+' · 論文公開日 '+esc(validDate(p.date) || "未確認")+' · レポート日 '+esc(p.reportDate || "未確認")+' · '+esc(p.id)+' · '+esc(readLevel(p))+'</div>'+
    '<h2>'+esc(p.title)+'</h2>'+
    '<div class="field-badges">'+fieldBadges(p,true)+'</div>'+
    '<div>'+tagList(p).filter(t=>!paperFields(p).some(f=>f.label===t)).map(t => '<span class="tag">'+esc(t)+'</span>').join("")+'</div>'+
    '<h4>概要</h4><p>'+esc(p.summary || "未記載")+'</p>'+sections+
    (p.dateNote ? '<p class="meta">'+esc(p.dateNote)+'</p>' : '')+
    (p.sourceSections ? '<p class="meta">本文の確認箇所: '+esc(p.sourceSections)+'</p>' : '')+
    '<p><a href="'+esc(safeUrl(p.url))+'" target="_blank" rel="noopener noreferrer">論文原文 ↗</a>　<a href="'+esc(repo+encodeURI(p.report))+'" target="_blank" rel="noopener noreferrer">元レポート ↗</a>'+
    (p.extraSource ? '　<a href="'+esc(safeUrl(p.extraSource))+'" target="_blank" rel="noopener noreferrer">確認した本文 ↗</a>' : '')+'</p>';
  for(const e of $("detail").querySelectorAll("[data-detail-field]")) e.onclick=()=>chooseField(e.dataset.detailField);
  renderList();
}
function compareDate(a,b,key,descending) {
  const da=validDate(a[key]), db=validDate(b[key]);
  if (!da && db) return 1;
  if (da && !db) return -1;
  return (descending ? db.localeCompare(da) : da.localeCompare(db)) || a.title.localeCompare(b.title);
}
function renderList() {
  $("field-panel").hidden = collectionFilter !== "foundations";
  const q = $("search").value.trim().toLowerCase(), sort=$("sort").value;
  const base = papers.filter(p => hasCollection(p,collectionFilter));
  const fieldBase = base.filter(p=>hasField(p,fieldFilter));
  const list = fieldBase.filter(p =>
    (!sourceFilter || (sourceFilter === "other" ? !["arXiv","PubMed"].includes(p.source) : p.source === sourceFilter)) &&
    (!q || [p.title,p.id,tagList(p).join(" "),paperFields(p).map(f=>f.display || f.label).join(" "),p.summary,p.objective,p.methods,p.results,p.novelty,p.limitations].join(" ").toLowerCase().includes(q))
  );
  list.sort((a,b) => sort === "title" ? a.title.localeCompare(b.title) :
    compareDate(a,b,sort.startsWith("report") ? "reportDate" : "date",sort.endsWith("new")));
  if (selected && !list.some(p => p.id === selected)) { selected = null; $("detail").innerHTML = '<div class="empty">論文を選択すると詳細を表示します。</div>'; }
  $("count").textContent = list.length + " 件を表示";
  $("list").innerHTML = list.length ? list.map(p => {
    const d=validDate(p.date);
    return '<button type="button" class="paper '+(p.id===selected?"active":"")+'" data-id="'+esc(p.id)+'" aria-pressed="'+(p.id===selected)+'">'+
      '<span class="paper-meta"><span class="source-label '+sourceClass(p)+'">'+esc(sourceName(p))+'</span>'+
      '<span class="paper-date">論文公開日 '+(d ? esc(d) : "未確認")+'</span><span class="paper-date">レポート日 '+esc(p.reportDate || "未確認")+'</span></span>'+
      '<span class="paper-title">'+esc(p.title)+'</span>'+
      '<span class="field-badges">'+fieldBadges(p)+'</span></button>';
  }).join("") : '<div class="empty">該当する論文がありません。</div>';
  for (const e of $("list").querySelectorAll("[data-id]")) e.onclick = () => {
    detail(papers.find(p => p.id === e.dataset.id));
    if (window.matchMedia("(max-width:750px)").matches) $("detail").scrollIntoView({behavior:"smooth",block:"start"});
  };
  for (const e of document.querySelectorAll("[data-source]")) e.setAttribute("aria-pressed",String(e.dataset.source === sourceFilter));
  for (const e of document.querySelectorAll("[data-collection]")) e.setAttribute("aria-pressed",String(e.dataset.collection === collectionFilter));
  $("all-count").textContent = "("+fieldBase.length+")";
  $("arxiv-count").textContent = "("+fieldBase.filter(p=>p.source==="arXiv").length+")";
  $("pubmed-count").textContent = "("+fieldBase.filter(p=>p.source==="PubMed").length+")";
  $("other-count").textContent = "("+fieldBase.filter(p=>!["arXiv","PubMed"].includes(p.source)).length+")";
  const fieldCountsBase = collectionFilter === "daily" ? papers.filter(p=>hasCollection(p,"foundations")) : base;
  for(const e of $("field-filters").querySelectorAll("[data-filter-field]")) {
    e.setAttribute("aria-pressed",String(e.dataset.filterField===fieldFilter));
    e.querySelector(".field-count").textContent=fieldCountsBase.filter(p=>hasField(p,e.dataset.filterField)).length;
  }
  for(const e of $("detail").querySelectorAll("[data-detail-field]")) e.setAttribute("aria-pressed",String(e.dataset.detailField===fieldFilter));
  $("field-note").textContent = "分野ラベルで絞り込み、検索・出典と組み合わせられます。複数分野の論文はそれぞれの件数に含まれます。";
  $("collection-note").innerHTML = collectionFilter === "foundations" ?
    '最新研究の前提となる手法・評価・研究の転換点をまとめています。<a href="'+repo+'reports/foundations/README.md" target="_blank" rel="noopener noreferrer">研究の流れと読み順 ↗</a>' :
    collectionFilter === "daily" ? '定期レポートで紹介した新着論文を掲載しています。' : '新着論文と基礎文献をまとめて検索できます。';
  if(collectionLoadWarning) $("collection-note").textContent=collectionLoadWarning;
  syncUrl();
}
for (const e of document.querySelectorAll("[data-collection]")) e.onclick = () => {
  collectionFilter=e.dataset.collection; sourceFilter="";
  if(collectionFilter !== "foundations") fieldFilter="";
  renderList();
};
for (const e of document.querySelectorAll("[data-source]")) e.onclick = () => {sourceFilter=e.dataset.source;renderList()};
$("search").addEventListener("input",renderList);
$("sort").addEventListener("change",renderList);
$("clear").onclick = () => {sourceFilter="";$("search").value="";fieldFilter="";$("sort").value="date-new";renderList()};
const loadCollection = async (file,collection) => {
  const r=await fetch(file);if(!r.ok)throw Error(file+": "+r.status);
  const data=await r.json();if(!Array.isArray(data.papers))throw Error(file+": invalid papers");
  return data.papers.map(p=>({...p,collections:[collection]}));
};
Promise.allSettled([loadCollection("./papers.json","daily"),loadCollection("./foundations.json","foundations")])
  .then(results=>{
    const merged=new Map();
    for (const result of results) if(result.status==="fulfilled") for(const p of result.value) {
      const old=merged.get(p.id);
      if(old) merged.set(p.id,{...old,collections:[...new Set([...old.collections,...p.collections])],fields:[...new Set([...(old.fields||[]),...(p.fields||[])])]});
      else merged.set(p.id,p);
    }
    papers = [...merged.values()];
    if(!papers.length)throw Error("文献データを読み込めませんでした");
    $("total").textContent = "全 " + papers.length + " 件";
    $("daily-count").textContent = "("+papers.filter(p=>hasCollection(p,"daily")).length+")";
    $("foundations-count").textContent = "("+papers.filter(p=>hasCollection(p,"foundations")).length+")";
    if(results[0].status==="rejected")collectionFilter="foundations";
    if(results[1].status==="rejected") { collectionFilter="daily"; fieldFilter=""; }
    if(results.some(r=>r.status==="rejected"))collectionLoadWarning="一部の文献集を読み込めませんでした。読み込めた文献を表示しています。再読み込みで再試行できます。";
    renderList();
  })
  .catch(e=>{
    $("count").textContent="読み込み失敗";
    $("list").innerHTML='<div class="empty">文献データを読み込めませんでした。ページを再読み込みしてください。</div>';
    console.error(e);
  });
</script></body></html>
