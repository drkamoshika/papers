<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Watch | Research Library</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1d2939;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}header{background:#12283b;color:#fff;padding:32px max(24px,calc((100vw - 1160px)/2))}header h1{font-size:28px;letter-spacing:-.6px;margin:0 0 8px}header p{margin:0;color:#bbccdb;font-size:14px}.wrap{max-width:1160px;margin:auto;padding:26px 22px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:white;border:1px solid #e1e8f0;border-radius:12px;padding:18px}.stat strong{display:block;font-size:27px}.stat span{font-size:12px;color:#637488}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}input,select{background:white;border:1px solid #cbd5e1;border-radius:9px;padding:12px;font:inherit;color:inherit}input{flex:1;min-width:230px}select{min-width:130px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #e1e8f0;border-radius:13px;overflow:hidden}.list{max-height:70vh;overflow:auto}.paper{padding:17px 20px;border-bottom:1px solid #edf0f5;cursor:pointer}.paper:hover,.paper.active{background:#f0f6fc}.paper h3{font-size:15px;line-height:1.55;margin:7px 0}.meta{color:#64748b;font-size:12px}.tag{display:inline-block;background:#eaf2f8;color:#345a78;border-radius:5px;font-size:11px;padding:3px 6px;margin:3px 4px 0 0}.paper p{color:#516276;font-size:13px;line-height:1.65;margin:7px 0 0}.detail{padding:24px;max-height:70vh;overflow:auto}.detail h2{font-size:20px;line-height:1.5;margin:8px 0 14px}.detail h4{margin:22px 0 7px}.detail p{line-height:1.8;white-space:pre-wrap;font-size:14px}.detail a{color:#1768a3}.muted{color:#64748b}.empty{padding:30px;text-align:center;color:#64748b}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;color:#64748b}.button{border:1px solid #cbd5e1;border-radius:7px;background:white;padding:8px 10px;cursor:pointer}.button:hover{background:#eef5fb}.notice{font-size:12px;color:#64748b;margin-top:20px}@media(max-width:750px){.layout{grid-template-columns:1fr}.list{max-height:45vh}.detail{max-height:none}.stats{grid-template-columns:repeat(3,1fr)}header{padding:25px 22px}.stat{padding:12px}.stat strong{font-size:21px}}</style></head><body><header><h1>Paper Watch <span style="font-weight:400;opacity:.65">/ Research Library</span></h1><p>機械学習・LLM・医療AIの論文アーカイブ</p></header><main class="wrap"><section class="stats"><div class="stat"><strong id="total">—</strong><span>収録論文</span></div><div class="stat"><strong id="arxiv">—</strong><span>arXiv</span></div><div class="stat"><strong id="pubmed">—</strong><span>PubMed</span></div></section><div class="filters"><input id="search" placeholder="タイトル・要約・タグ・本文を検索"><select id="source"><option value="">すべてのソース</option><option>arXiv</option><option>PubMed</option></select><select id="sort"><option value="new">新しいレポート順</option><option value="old">古いレポート順</option><option value="title">タイトル順</option></select></div><div class="toolbar"><span id="count">読み込み中...</span><button class="button" id="clear">条件をクリア</button></div><div class="layout"><div class="panel list" id="list"></div><article class="panel detail" id="detail"><div class="empty">論文を選択すると詳細を表示します。</div></article></div><p class="notice">データは統一スキーマで検証されたMarkdownから生成。論文ごとの研究目的・手法・結果・新規性・限界を表示します。</p></main><script>
let papers=[],selected=null;const tagList=p=>Array.isArray(p.tags)?p.tags:String(p.tags||"").split(",").map(s=>s.trim()).filter(Boolean);const $=id=>document.getElementById(id);const esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const repo="https://github.com/drkamoshika/papers/blob/main/";
function detail(p){selected=p.id;const fields=[["研究目的",p.objective],["手法・研究デザイン",p.methods],["実験・主な結果",p.results],["新規性",p.novelty],["限界",p.limitations]];const sections=fields.map(([label,val])=>'<h4>'+esc(label)+'</h4><p>'+esc(val||"未記載")+'</p>').join("");$("detail").innerHTML='<div class="meta">'+esc(p.source)+' · 公開 '+esc(p.date||"未記載")+' · 収録 '+esc(p.reportDate)+' · '+esc(p.id)+' · '+esc(p.read_level)+'</div><h2>'+esc(p.title)+'</h2><div>'+tagList(p).map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div><h4>概要</h4><p>'+esc(p.summary||"未記載")+'</p>'+sections+'<p><a href="'+esc(p.url)+'" target="_blank" rel="noopener">論文原文 ↗</a>　<a href="'+repo+encodeURI(p.report)+'" target="_blank" rel="noopener">元レポート ↗</a></p>';renderList()}
function renderList(){const q=$("search").value.trim().toLowerCase(),s=$("source").value;let list=papers.filter(p=>(!s||p.source===s)&&(!q||[p.title,tagList(p).join(" "),p.summary,p.objective,p.methods,p.results,p.novelty,p.limitations,p.id].join(" ").toLowerCase().includes(q)));const sort=$("sort").value;list.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):sort==="old"?a.reportDate.localeCompare(b.reportDate):b.reportDate.localeCompare(a.reportDate));$("count").textContent=list.length+" 件を表示";$("list").innerHTML=list.length?list.map(p=>'<div class="paper '+(p.id===selected?"active":"")+'" data-id="'+esc(p.id)+'"><div class="meta">'+esc(p.source)+' · '+esc(p.date||p.reportDate)+'</div><h3>'+esc(p.title)+'</h3><div>'+tagList(p).slice(0,4).map(t=>'<span class="tag">'+t.trim()+'</span>').join("")+'</div><p>'+esc(p.summary).slice(0,150)+'</p></div>').join(""):'<div class="empty">該当する論文がありません。</div>';for(const e of $("list").querySelectorAll("[data-id]"))e.onclick=()=>detail(papers.find(p=>p.id===e.dataset.id))}
for(const id of ["search","source","sort"])$(id).addEventListener(id==="search"?"input":"change",renderList);$("clear").onclick=()=>{$("search").value="";$("source").value="";$("sort").value="new";renderList()};
fetch("./papers.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{papers=data.papers;$("total").textContent=papers.length;$("arxiv").textContent=papers.filter(p=>p.source==="arXiv").length;$("pubmed").textContent=papers.filter(p=>p.source==="PubMed").length;renderList();if(papers.length)detail(papers[0])}).catch(e=>{$("count").textContent="読み込み失敗";$("list").innerHTML='<div class="empty">papers.jsonを読み込めませんでした。HTTPサーバー経由で開いてください。</div>';console.error(e)});
</script></body></html>
