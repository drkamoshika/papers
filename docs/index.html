<header class="site-header"><div class="brand">Paper Watch</div><p>機械学習・LLM・医療AIの論文ライブラリ</p></header>
<main class="wrap"><section id="catalog" aria-labelledby="catalog-heading">
<div class="catalog-top"><h1 id="catalog-heading">論文一覧</h1><span class="total" id="total">読み込み中...</span></div>
<nav class="collection-switch" aria-label="文献集">
<button type="button" class="collection-tab" data-collection="daily" aria-pressed="true">新着論文 <span id="daily-count"></span></button>
<button type="button" class="collection-tab" data-collection="foundations" aria-pressed="false">基礎文献 <span id="foundations-count"></span></button>
<button type="button" class="collection-tab" data-collection="" aria-pressed="false">両方</button><button type="button" class="collection-tab" id="overview-tab" aria-pressed="false">全体マップ</button></nav>
<section class="overview" id="overview" aria-label="基礎から現在への全体マップ" hidden></section>
<div id="paper-browser">
<p class="collection-note" id="collection-note">定期レポートで紹介した新着論文を掲載しています。</p>
<section class="field-panel" id="field-panel" aria-labelledby="field-heading" hidden><h2 class="field-heading" id="field-heading">基礎文献の分野</h2><nav class="field-filters" id="field-filters" aria-label="分野で絞り込む"></nav><p class="field-note" id="field-note">分野を読み込み中...</p></section>
<nav class="source-switch" aria-label="論文の出典">
<button type="button" class="source-tab" data-source="" aria-pressed="true">すべて <span id="all-count"></span></button><button type="button" class="source-tab" data-source="arXiv" aria-pressed="false">arXiv <span id="arxiv-count"></span></button><button type="button" class="source-tab" data-source="PubMed" aria-pressed="false">PubMed <span id="pubmed-count"></span></button><button type="button" class="source-tab" data-source="other" aria-pressed="false">出版社・その他 <span id="other-count"></span></button></nav>
<label class="search-wrap"><input id="search" type="search" aria-label="論文検索" placeholder="気になるテーマ・タイトル・論文IDで検索"></label>
<details class="filter-options" id="filter-options"><summary>並び順 <span id="filter-status"></span></summary><div class="filter-content"><label class="sort-control"><span class="filter-label">並び順</span><select id="sort"><option value="date-new">論文公開日：新しい順</option><option value="date-old">論文公開日：古い順</option><option value="report-new">レポート日：新しい順</option><option value="report-old">レポート日：古い順</option><option value="title">タイトル順</option></select></label></div></details>
<div class="toolbar"><span id="count" role="status" aria-live="polite">読み込み中...</span><button class="button" type="button" id="clear">条件をクリア</button></div>
<div class="list" id="list" aria-label="論文一覧"></div><button class="button load-more" type="button" id="load-more" hidden>さらに30件を表示</button><p class="notice">日本語の概要から論文を選ぶと、目的・手法・結果を読めます。公開日未確認の論文は公開日順では末尾に表示します。</p></div></section>
<section class="reader-shell" id="reader-view" aria-label="論文を読む" hidden><nav class="reader-nav" aria-label="読書画面"><button class="back-button" type="button" id="back">← 一覧に戻る</button><a id="reader-original" target="_blank" rel="noopener noreferrer">論文原文 ↗</a></nav><article class="reader" id="detail"></article><div class="reader-bottom"><button class="button" type="button" id="back-bottom">一覧に戻る</button></div></section></main>
<script src="./overview.js?v=20261118"></script>
<script>
const fieldDefinitions=[
 {key:"language",label:"言語モデルの学習・推論・効率化"},{key:"agents",label:"エージェント・検索・記憶・協調"},
 {key:"trust",label:"評価・安全性・解釈可能性"},{key:"medical",label:"医療・生体信号・創薬AI"},
 {key:"structured",label:"表形式・時系列・因果推論"},{key:"events",label:"次イベント予測・点過程"},
 {key:"neuroscience",label:"神経科学とAI"},{key:"classics",label:"主要な出発点",display:"古典・共通基礎（別冊）"}
];
const $=id=>document.getElementById(id);
const tagList=p=>Array.isArray(p.tags)?p.tags:String(p.tags||"").split(",").map(s=>s.trim()).filter(Boolean);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const repo="https://github.com/drkamoshika/papers/blob/main/";
const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(String(v||""))?v:"";
const sourceName=p=>p.source||"出典未確認";
const sourceClass=p=>p.source==="PubMed"?"pubmed":p.source==="arXiv"?"":"other";
const readLevel=p=>({abstract:"要旨確認",full_text:"本文の関連箇所確認",bibliographic:"書誌情報のみ"}[p.read_level]||"確認範囲未記載");
const hasCollection=(p,c)=>!c||p.collections.includes(c);
const paperFields=p=>fieldDefinitions.filter(f=>(p.fields||[]).includes(f.label));
const hasField=(p,key)=>!key||paperFields(p).some(f=>f.key===key);
const safeUrl=url=>/^https:\/\//.test(String(url||""))?url:"#";
const sortOptions=["date-new","date-old","report-new","report-old","title"];
let papers=[],selected=null,collectionFilter="daily",fieldFilter="",sourceFilter="",collectionLoadWarning="",visibleLimit=30,ready=false,available=[];
if("scrollRestoration" in history) history.scrollRestoration="manual";
function readFilters(){
 const params=new URLSearchParams(location.search),c=params.get("collection");
 readOverviewParams(params);
 collectionFilter=c==="all"?"":c==="foundations"?"foundations":"daily";
 fieldFilter=fieldDefinitions.some(f=>f.key===params.get("field"))?params.get("field"):"";
 if(fieldFilter)collectionFilter="foundations";
 sourceFilter=["arXiv","PubMed","other"].includes(params.get("source"))?params.get("source"):"";
 $("search").value=params.get("q")||"";
 $("sort").value=sortOptions.includes(params.get("sort"))?params.get("sort"):"date-new";
}
function viewUrl(paperId=null){
 const url=new URL(location.href);
 for(const k of ["collection","field","source","q","sort","paper"])url.searchParams.delete(k);
 if(collectionFilter!=="daily")url.searchParams.set("collection",collectionFilter||"all");
 if(fieldFilter)url.searchParams.set("field",fieldFilter);
 if(sourceFilter)url.searchParams.set("source",sourceFilter);
 if($("search").value.trim())url.searchParams.set("q",$("search").value.trim());
 if($("sort").value!=="date-new")url.searchParams.set("sort",$("sort").value);
 if(paperId)url.searchParams.set("paper",paperId);
 applyOverviewParams(url,paperId);url.hash="";
 return url;
}
function fieldBadges(p,interactive=false){return paperFields(p).map(f=>interactive?
 '<button type="button" class="field-badge" data-field-key="'+f.key+'" data-detail-field="'+f.key+'" aria-label="'+esc(f.label)+'で絞り込む">'+esc(f.display||f.label)+'</button>':
 '<span class="field-badge" data-field-key="'+f.key+'">'+esc(f.display||f.label)+'</span>').join("");}
$("field-filters").innerHTML=[{key:"",label:"すべての分野"},...fieldDefinitions].map(f=>'<button type="button" class="field-filter" data-filter-field="'+f.key+'" data-field-key="'+f.key+'" aria-pressed="false"><span>'+esc(f.display||f.label)+'</span><span class="field-count"></span></button>').join("");
function synopsis(p){
 const text=String(p.summary||p.objective||"日本語の概要は未記載です。").trim(),stop=text.indexOf("。");
 return stop>=0?text.slice(0,stop+1):text;
}
function readerSections(p){
 const fields=[["概要",p.summary],["研究目的",p.objective],["手法・研究デザイン",p.methods],["データ・主な結果",p.results],["この研究の新しさ",p.novelty],["限界・解釈上の注意",p.limitations]],groups=[];
 for(const [label,value]of fields){
  const text=String(value||"").trim(),same=text&&groups.find(g=>g.text===text);
  if(same)same.labels.push(label);else groups.push({labels:[label],text});
 }
 return groups.map(g=>'<section class="reader-section '+(g.labels.includes("概要")?'lead ':'')+(!g.text?'missing':'')+'"><h2>'+esc(g.labels.join(" / "))+'</h2><p>'+esc(g.text||"元レポートに記載がありません。")+'</p></section>').join("");
}
function renderReader(p){
 selected=p.id;$("catalog").hidden=true;$("reader-view").hidden=false;document.title=p.title+" | Paper Watch";$("reader-original").href=safeUrl(p.url);
 const tags=tagList(p).filter(t=>!paperFields(p).some(f=>f.label===t));
 $("detail").innerHTML='<div class="reader-meta"><span class="source-label '+sourceClass(p)+'">'+esc(sourceName(p))+'</span><span>論文公開日 '+esc(validDate(p.date)||"未確認")+'</span></div>'+
 '<h1 id="reader-title" tabindex="-1">'+esc(p.title)+'</h1>'+(paperFields(p).length?'<div class="field-badges">'+fieldBadges(p,true)+'</div>':'')+readerSections(p)+
 '<section class="reader-sources"><h2>出典</h2><div class="source-links"><a href="'+esc(safeUrl(p.url))+'" target="_blank" rel="noopener noreferrer">論文原文 ↗</a><a href="'+esc(repo+encodeURI(p.report))+'" target="_blank" rel="noopener noreferrer">元レポート ↗</a>'+
 (p.extraSource?'<a href="'+esc(safeUrl(p.extraSource))+'" target="_blank" rel="noopener noreferrer">確認した本文 ↗</a>':'')+'</div></section>'+
 '<details class="verification"><summary>書誌情報・確認範囲</summary><dl><dt>論文ID</dt><dd>'+esc(p.id)+'</dd><dt>論文公開日</dt><dd>'+esc(validDate(p.date)||"未確認")+'</dd><dt>レポート日</dt><dd>'+esc(p.reportDate||"未確認")+'</dd><dt>確認範囲</dt><dd>'+esc(readLevel(p))+'</dd></dl>'+
 (p.dateNote?'<p>'+esc(p.dateNote)+'</p>':'')+(p.sourceSections?'<p>確認した箇所：'+esc(p.sourceSections)+'</p>':'')+
 (tags.length?'<div>'+tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("")+'</div>':'')+'</details>';
 for(const e of $("detail").querySelectorAll("[data-detail-field]"))e.onclick=()=>chooseField(e.dataset.detailField);
}
function showCatalog(){selected=null;$("catalog").hidden=false;$("reader-view").hidden=true;document.title=overviewState.active?"全体マップ | Paper Watch":"Paper Watch | 論文ライブラリ";}
function openPaper(p){
 if(!p)return;
 history.replaceState({...history.state,catalogScroll:window.scrollY,visibleLimit,focusId:p.id},"",viewUrl());
 history.pushState({readerEntry:true},"",overviewState.active?overviewPaperUrl(p.id):viewUrl(p.id));renderReader(p);window.scrollTo(0,0);$("reader-title").focus({preventScroll:true});
}
function backToList(){
 if(history.state?.readerEntry)history.back();
 else{history.replaceState({},"",viewUrl());showCatalog();renderList();window.scrollTo(0,0);$("search").focus({preventScroll:true});}
}
function compareDate(a,b,key,descending){
 const da=validDate(a[key]),db=validDate(b[key]);if(!da&&db)return 1;if(da&&!db)return -1;
 return(descending?db.localeCompare(da):da.localeCompare(db))||a.title.localeCompare(b.title);
}
function renderList(){
 if(ready&&collectionFilter&&!available.includes(collectionFilter)){collectionFilter=available[0];fieldFilter="";}
 $("field-panel").hidden=collectionFilter!=="foundations";
 const q=$("search").value.trim().toLowerCase(),sort=$("sort").value,base=papers.filter(p=>hasCollection(p,collectionFilter)),fieldBase=base.filter(p=>hasField(p,fieldFilter));
 const list=fieldBase.filter(p=>(!sourceFilter||(sourceFilter==="other"?!["arXiv","PubMed"].includes(p.source):p.source===sourceFilter))&&(!q||[p.title,p.id,tagList(p).join(" "),paperFields(p).map(f=>f.display||f.label).join(" "),p.summary,p.objective,p.methods,p.results,p.novelty,p.limitations].join(" ").toLowerCase().includes(q)));
 list.sort((a,b)=>sort==="title"?a.title.localeCompare(b.title):compareDate(a,b,sort.startsWith("report")?"reportDate":"date",sort.endsWith("new")));
 const shown=list.slice(0,visibleLimit);$("count").textContent=list.length+" 件"+(shown.length<list.length?" · "+shown.length+" 件を表示":"を表示");
 $("list").innerHTML=shown.length?shown.map(p=>'<a class="paper" data-id="'+esc(p.id)+'" href="'+esc(viewUrl(p.id).href)+'"><div class="paper-meta"><span class="source-label '+sourceClass(p)+'">'+esc(sourceName(p))+'</span><span>公開 '+esc(validDate(p.date)||"未確認")+'</span></div><p class="paper-description">'+esc(synopsis(p))+'</p><h2 class="paper-title">'+esc(p.title)+'</h2>'+(paperFields(p).length?'<div class="field-badges">'+fieldBadges(p)+'</div>':'')+'</a>').join(""):'<div class="empty">該当する論文がありません。<br>検索語や絞り込み条件を変えてみてください。</div>';
 for(const e of $("list").querySelectorAll("[data-id]"))e.onclick=event=>{
  if(event.button!==0||event.metaKey||event.ctrlKey||event.shiftKey||event.altKey)return;
  event.preventDefault();openPaper(papers.find(p=>p.id===e.dataset.id));
 };
 $("load-more").hidden=shown.length>=list.length;$("load-more").textContent="さらに"+Math.min(30,list.length-shown.length)+"件を表示";
 for(const e of document.querySelectorAll("[data-source]"))e.setAttribute("aria-pressed",String(e.dataset.source===sourceFilter));
 for(const e of document.querySelectorAll("[data-collection]"))e.setAttribute("aria-pressed",String(e.dataset.collection===collectionFilter));
 $("all-count").textContent="("+fieldBase.length+")";$("arxiv-count").textContent="("+fieldBase.filter(p=>p.source==="arXiv").length+")";$("pubmed-count").textContent="("+fieldBase.filter(p=>p.source==="PubMed").length+")";$("other-count").textContent="("+fieldBase.filter(p=>!["arXiv","PubMed"].includes(p.source)).length+")";
 for(const e of $("field-filters").querySelectorAll("[data-filter-field]")){e.setAttribute("aria-pressed",String(e.dataset.filterField===fieldFilter));e.querySelector(".field-count").textContent=base.filter(p=>hasField(p,e.dataset.filterField)).length;}
 $("field-note").textContent="複数分野の論文は、それぞれの件数に含まれます。検索・出典と組み合わせて絞り込めます。";
 $("filter-status").textContent=" · "+$("sort").selectedOptions[0].textContent;
 $("collection-note").innerHTML=collectionFilter==="foundations"?'最新研究の基盤となる手法・評価・転換点を読む。<a href="'+repo+'reports/foundations/README.md" target="_blank" rel="noopener noreferrer">研究の流れと読み順 ↗</a>':collectionFilter==="daily"?'定期レポートで紹介した新着論文。日本語の概要から探せます。':'新着論文と基礎文献をまとめて検索できます。';
 if(collectionLoadWarning)$("collection-note").textContent=collectionLoadWarning;
 syncOverviewMode();
}
function filtersChanged(){overviewState.active=false;visibleLimit=30;showCatalog();renderList();history.replaceState({},"",viewUrl());}
function chooseField(key){fieldFilter=key;if(key&&collectionFilter!=="foundations"){collectionFilter="foundations";sourceFilter="";}const wasReading=selected!==null;filtersChanged();if(wasReading){window.scrollTo(0,0);$("search").focus({preventScroll:true});}}
for(const e of $("field-filters").querySelectorAll("[data-filter-field]"))e.onclick=()=>chooseField(e.dataset.filterField);
for(const e of document.querySelectorAll("[data-collection]"))e.onclick=()=>{collectionFilter=e.dataset.collection;sourceFilter="";if(collectionFilter!=="foundations")fieldFilter="";filtersChanged();};
for(const e of document.querySelectorAll("[data-source]"))e.onclick=()=>{sourceFilter=e.dataset.source;filtersChanged();};
$("search").addEventListener("input",filtersChanged);$("sort").addEventListener("change",filtersChanged);
$("clear").onclick=()=>{sourceFilter="";fieldFilter="";$("search").value="";$("sort").value="date-new";filtersChanged();};
$("load-more").onclick=()=>{visibleLimit+=30;renderList();};$("back").onclick=backToList;$("back-bottom").onclick=backToList;
window.addEventListener("popstate",()=>{
 if(!ready)return;readFilters();visibleLimit=history.state?.visibleLimit||30;renderList();
 const p=papers.find(p=>p.id===new URLSearchParams(location.search).get("paper"));
 if(p){renderReader(p);window.scrollTo(0,0);$("reader-title").focus({preventScroll:true});}
 else{showCatalog();const saved=history.state||{};requestAnimationFrame(()=>{const card=overviewState.active?[...$("overview").querySelectorAll("[data-map-paper]")].find(e=>e.dataset.mapPaper===saved.focusId):[...$("list").querySelectorAll("[data-id]")].find(e=>e.dataset.id===saved.focusId);if(card)card.focus({preventScroll:true});window.scrollTo(0,saved.catalogScroll||0);});}
});
const loadCollection=async(file,collection)=>{const r=await fetch(file,{cache:"no-cache"});if(!r.ok)throw Error(file+": "+r.status);const data=await r.json();if(!Array.isArray(data.papers))throw Error(file+": invalid papers");return data.papers.map(p=>({...p,collections:[collection]}));};
readFilters();initializeOverview();syncOverviewMode();
Promise.allSettled([loadCollection("./papers.json","daily"),loadCollection("./foundations.json","foundations")]).then(results=>{
 const merged=new Map();available=results.flatMap((r,i)=>r.status==="fulfilled"?[["daily","foundations"][i]]:[]);
 for(const result of results)if(result.status==="fulfilled")for(const p of result.value){const old=merged.get(p.id);if(old)merged.set(p.id,{...old,collections:[...new Set([...old.collections,...p.collections])],fields:[...new Set([...(old.fields||[]),...(p.fields||[])])]});else merged.set(p.id,p);}
 papers=[...merged.values()];if(!papers.length)throw Error("文献データを読み込めませんでした");
 $("total").textContent="全 "+papers.length+" 件";$("daily-count").textContent="("+papers.filter(p=>hasCollection(p,"daily")).length+")";$("foundations-count").textContent="("+papers.filter(p=>hasCollection(p,"foundations")).length+")";
 if(results.some(r=>r.status==="rejected"))collectionLoadWarning="一部の文献集を読み込めませんでした。読み込めた文献を表示しています。再読み込みで再試行できます。";
 ready=true;renderList();const p=papers.find(p=>p.id===new URLSearchParams(location.search).get("paper"));if(p)renderReader(p);else{showCatalog();history.replaceState({},"",viewUrl());}
}).catch(e=>{$("count").textContent="読み込み失敗";$("list").innerHTML='<div class="empty">文献データを読み込めませんでした。ページを再読み込みしてください。</div>';console.error(e);});
</script></body></html>
