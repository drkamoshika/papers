<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper Watch | Research Library</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:#1d2939;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}
header{background:#12283b;color:white;padding:24px max(20px,calc((100vw - 1160px)/2))}
header h1{font-size:25px;margin:0 0 5px;letter-spacing:-.5px}header p{font-size:13px;margin:0;color:#bacbd8}
.wrap{max-width:1160px;margin:auto;padding:22px 20px}
.catalog-top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:13px}
.catalog-top h2{font-size:18px;margin:0}.total{font-size:13px;color:#64748b}
.source-switch{display:flex;gap:5px;flex-wrap:wrap;background:#e8edf3;border-radius:11px;padding:5px;margin-bottom:12px}
.source-tab{border:0;background:transparent;border-radius:8px;color:#40546b;cursor:pointer;padding:10px 17px;font-weight:600;font-size:14px}
.source-tab:hover{background:#f7fafc}.source-tab[aria-pressed="true"]{background:#fff;color:#123e63;box-shadow:0 1px 5px #102b3a1c}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{background:white;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;color:inherit}
input{flex:1;min-width:220px}select{min-width:185px}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 10px;font-size:13px;color:#64748b}
.button{border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:7px 11px;cursor:pointer}.button:hover{background:#f0f5fa}
.layout{display:grid;grid-template-columns:minmax(260px,0.85fr) minmax(0,1.4fr);gap:14px;align-items:start}
.panel{background:white;border:1px solid #dfe7ee;border-radius:12px;overflow:hidden}
.list{max-height:72vh;overflow-y:auto}
.paper{display:block;width:100%;padding:13px 16px;border:0;border-bottom:1px solid #edf0f5;background:white;color:inherit;text-align:left;cursor:pointer}
.paper:last-child{border-bottom:0}.paper:hover{background:#f6f9fc}.paper.active{background:#edf5fc;box-shadow:inset 3px 0 #2274ae}
.paper-meta{display:flex;align-items:center;gap:9px;margin-bottom:5px;flex-wrap:wrap}
.source-label{display:inline-block;border-radius:5px;background:#e7f1fb;color:#185681;font-size:11px;font-weight:700;padding:3px 7px}
.source-label.pubmed{background:#e6f4ed;color:#176a4a}
.paper-date,.meta{color:#64748b;font-size:12px}
.paper-title{display:block;font-size:14px;font-weight:600;line-height:1.6;overflow-wrap:anywhere}
.detail{padding:24px;max-height:72vh;overflow-y:auto}
.detail h2{font-size:21px;line-height:1.5;margin:10px 0 14px;overflow-wrap:anywhere}
.detail h4{margin:22px 0 7px}.detail p{line-height:1.8;white-space:pre-wrap;font-size:14px}
.detail a{color:#1768a3}.tag{display:inline-block;background:#eaf2f8;color:#345a78;border-radius:5px;font-size:11px;padding:3px 6px;margin:3px 4px 0 0}
.empty{padding:32px 20px;text-align:center;color:#64748b}.notice{font-size:12px;color:#64748b;margin-top:18px}
@media(max-width:750px){header{padding:20px}.wrap{padding:16px 12px}.layout{grid-template-columns:1fr}.list{max-height:43vh}.detail{max-height:none}.source-tab{flex:1;padding:10px 9px}.detail{padding:18px}.paper{padding:12px 14px}select{flex:1}}
</style></head><body>
<header><h1>Paper Watch <span style="font-weight:400;opacity:.65">/ Research Library</span></h1><p>機械学習・LLM・医療AIの論文アーカイブ</p></header>
<main class="wrap">
  <div class="catalog-top"><h2>論文一覧</h2><span class="total" id="total">読み込み中...</span></div>
  <nav class="source-switch" aria-label="論文の出典">
    <button type="button" class="source-tab" data-source="" aria-pressed="true">すべて <span id="all-count"></span></button>
    <button type="button" class="source-tab" data-source="arXiv" aria-pressed="false">arXiv <span id="arxiv-count"></span></button>
    <button type="button" class="source-tab" data-source="PubMed" aria-pressed="false">PubMed <span id="pubmed-count"></span></button>
  </nav>
  <div class="filters">
    <input id="search" type="search" aria-label="論文検索" placeholder="タイトル・論文ID・本文などを検索">
    <select id="sort" aria-label="並び替え">
      <option value="date-new">論文公開日：新しい順</option>
      <option value="date-old">論文公開日：古い順</option>
      <option value="report-new">レポート日：新しい順</option>
      <option value="report-old">レポート日：古い順</option>
      <option value="title">タイトル順</option>
    </select>
  </div>
  <div class="toolbar"><span id="count">読み込み中...</span><button class="button" type="button" id="clear">条件をクリア</button></div>
  <div class="layout">
    <div class="panel list" id="list" aria-label="論文一覧"></div>
    <article class="panel detail" id="detail"><div class="empty">論文を選択すると詳細を表示します。</div></article>
  </div>
  <p class="notice">一覧は出典・論文公開日・レポート日・タイトルのみ表示。研究目的・手法・結果・新規性・限界は論文を選択すると表示します。公開日未確認の論文は公開日順では末尾になります。</p>
</main><script>
let papers = [], selected = null, sourceFilter = "";
const $ = id => document.getElementById(id);
const tagList = p => Array.isArray(p.tags) ? p.tags : String(p.tags || "").split(",").map(s => s.trim()).filter(Boolean);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const repo = "https://github.com/drkamoshika/papers/blob/main/";
const validDate = value => /^\d{4}-\d{2}-\d{2}$/.test(String(value || "")) ? value : "";
const sourceName = p => p.source === "PubMed" ? "PubMed" : "arXiv";
function detail(p) {
  if (!p) return;
  selected = p.id;
  const fields = [["研究目的",p.objective],["手法・研究デザイン",p.methods],["実験・主な結果",p.results],["新規性",p.novelty],["限界",p.limitations]];
  const sections = fields.map(([label,val]) => "<h4>"+esc(label)+"</h4><p>"+esc(val || "未記載")+"</p>").join("");
  $("detail").innerHTML =
    '<div class="meta">'+esc(sourceName(p))+' · 論文公開日 '+esc(validDate(p.date) || "未確認")+' · レポート日 '+esc(p.reportDate || "未確認")+' · '+esc(p.id)+' · '+esc(p.read_level || "")+'</div>'+
    '<h2>'+esc(p.title)+'</h2>'+
    '<div>'+tagList(p).map(t => '<span class="tag">'+esc(t)+'</span>').join("")+'</div>'+
    '<h4>概要</h4><p>'+esc(p.summary || "未記載")+'</p>'+sections+
    '<p><a href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">論文原文 ↗</a>　<a href="'+esc(repo+encodeURI(p.report))+'" target="_blank" rel="noopener noreferrer">元レポート ↗</a></p>';
  renderList();
}
function compareDate(a,b,key,descending) {
  const da=validDate(a[key]), db=validDate(b[key]);
  if (!da && db) return 1;
  if (da && !db) return -1;
  return (descending ? db.localeCompare(da) : da.localeCompare(db)) || a.title.localeCompare(b.title);
}
function renderList() {
  const q = $("search").value.trim().toLowerCase(), sort=$("sort").value;
  const list = papers.filter(p =>
    (!sourceFilter || p.source === sourceFilter) &&
    (!q || [p.title,p.id,tagList(p).join(" "),p.summary,p.objective,p.methods,p.results,p.novelty,p.limitations].join(" ").toLowerCase().includes(q))
  );
  list.sort((a,b) => sort === "title" ? a.title.localeCompare(b.title) :
    compareDate(a,b,sort.startsWith("report") ? "reportDate" : "date",sort.endsWith("new")));
  if (selected && !list.some(p => p.id === selected)) { selected = null; $("detail").innerHTML = '<div class="empty">論文を選択すると詳細を表示します。</div>'; }
  $("count").textContent = list.length + " 件を表示";
  $("list").innerHTML = list.length ? list.map(p => {
    const d=validDate(p.date);
    return '<button type="button" class="paper '+(p.id===selected?"active":"")+'" data-id="'+esc(p.id)+'" aria-pressed="'+(p.id===selected)+'">'+
      '<span class="paper-meta"><span class="source-label '+(p.source==="PubMed"?"pubmed":"")+'">'+esc(sourceName(p))+'</span>'+
      '<span class="paper-date">論文公開日 '+(d ? esc(d) : "未確認")+'</span><span class="paper-date">レポート日 '+esc(p.reportDate || "未確認")+'</span></span>'+
      '<span class="paper-title">'+esc(p.title)+'</span></button>';
  }).join("") : '<div class="empty">該当する論文がありません。</div>';
  for (const e of $("list").querySelectorAll("[data-id]")) e.onclick = () => {
    detail(papers.find(p => p.id === e.dataset.id));
    if (window.matchMedia("(max-width:750px)").matches) $("detail").scrollIntoView({behavior:"smooth",block:"start"});
  };
  for (const e of document.querySelectorAll("[data-source]")) e.setAttribute("aria-pressed",String(e.dataset.source === sourceFilter));
}
for (const e of document.querySelectorAll("[data-source]")) e.onclick = () => {sourceFilter=e.dataset.source;renderList()};
$("search").addEventListener("input",renderList);
$("sort").addEventListener("change",renderList);
$("clear").onclick = () => {sourceFilter="";$("search").value="";$("sort").value="date-new";renderList()};
fetch("./papers.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()})
  .then(data=>{
    papers = data.papers || [];
    $("total").textContent = "全 " + papers.length + " 件";
    $("all-count").textContent = "(" + papers.length + ")";
    $("arxiv-count").textContent = "(" + papers.filter(p=>p.source==="arXiv").length + ")";
    $("pubmed-count").textContent = "(" + papers.filter(p=>p.source==="PubMed").length + ")";
    renderList();
  })
  .catch(e=>{
    $("count").textContent="読み込み失敗";
    $("list").innerHTML='<div class="empty">papers.jsonを読み込めませんでした。ページを再読み込みしてください。</div>';
    console.error(e);
  });
</script></body></html>
